events {}

http {
    # 컨테이너 이름으로 내부 통신 (compose 네트워크)
    upstream frontend_upstream {
        server frontend:3000;
    }
    upstream backend_upstream {
        server backend:8080;
    }

    # HTTP(80) → HTTPS(443) 리다이렉트
    server {
        listen 80;
        server_name h14k011.p.ssafy.io;
        return 301 https://$host$request_uri;
    }

    # HTTPS(443) 본 서버
    server {
        listen 443 ssl;
        http2 on;
        server_name h14k011.p.ssafy.io;

        # Let's Encrypt 인증서 (서버의 /etc/letsencrypt 를 마운트)
        ssl_certificate     /etc/letsencrypt/live/h14k011.p.ssafy.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/h14k011.p.ssafy.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # 업로드 등 큰 요청 허용
        client_max_body_size 20m;

        # 백엔드 API (컨트롤러가 /api/v1/... 경로를 직접 제공 → 경로 보존)
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger / OpenAPI 문서 (선택)
        location /swagger-ui {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
        }
        location /v3/api-docs {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
        }

        # 나머지는 모두 프론트엔드(Next.js)
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
