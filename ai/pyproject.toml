[project]
name = "seasonal-kitchen-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
]

[dependency-groups]
price-prediction = [
    "scikit-learn>=1.5.2",
    "numpy>=2.1.1",
    "pandas>=2.2.3",
    "joblib>=1.4.2",
]
recommendation = [
    "scikit-learn>=1.5.2",
    "numpy>=2.1.1",
    "pandas>=2.2.3",
    "joblib>=1.4.2",
]
product-automation = [
    "anthropic>=0.34.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
]
