name: Deploy

# main 에 push 되면 자동 실행. Actions 탭에서 수동 실행도 가능.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/bobsimz/seasonal-kitchen-backend
  IMAGE_FRONTEND: ghcr.io/bobsimz/seasonal-kitchen-frontend

jobs:
  # 1) 어떤 폴더가 바뀌었는지 감지
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # 알림) 배포 시작 — 실제 배포가 트리거될 때만 전송
  notify-start:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Discord 시작 알림
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref_name }}
          BE: ${{ needs.changes.outputs.backend }}
          FE: ${{ needs.changes.outputs.frontend }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$WEBHOOK" ] && { echo "DISCORD_WEBHOOK 미설정 — 스킵"; exit 0; }
          content=$(jq -n --arg msg "$MSG" --arg actor "$ACTOR" --arg ref "$REF" \
            --arg be "$BE" --arg fe "$FE" --arg url "$RUN_URL" \
            '{content: ("🚀 **배포 시작** · 브랜치 `\($ref)` · \($actor)\n> " + (($msg | split("\n"))[0]) + "\n대상 — 백엔드: \($be) / 프론트: \($fe)\n[실행 로그](\($url))")}')
          curl -s -H "Content-Type: application/json" -d "$content" "$WEBHOOK" -o /dev/null -w "discord %{http_code}\n" || echo "알림 전송 실패(무시)"

  # 2-a) backend 가 바뀌었을 때만 빌드 → GHCR push
  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2-b) frontend 가 바뀌었을 때만 빌드 → GHCR push
  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://h14k011.p.ssafy.io
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3) 서버에 배포 (바뀐 쪽만 새 이미지로 교체)
  deploy:
    needs: [changes, build-backend, build-frontend]
    # 빌드가 하나라도 실패하면 배포 안 함. 둘 중 하나만 바뀌어 skip 된 경우는 허용.
    if: >
      ${{ !cancelled()
      && needs.build-backend.result != 'failure'
      && needs.build-frontend.result != 'failure'
      && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # 운영 compose / nginx 설정 파일을 서버로 복사 (비밀 아님)
      - name: Copy compose & nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,nginx/nginx.conf"
          target: "seasonal-kitchen"

      # 서버에서 GHCR 로그인 → 새 이미지 pull → 재기동
      - name: Pull & restart on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd ~/seasonal-kitchen
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            docker logout ghcr.io
            # 배포 후 헬스체크 (최대 60초 대기). 실패하면 배포 job 도 실패 처리.
            echo "헬스체크 대기..."
            for i in $(seq 1 12); do
              if curl -fsSLk https://localhost/api/v1/health >/dev/null 2>&1; then
                echo "헬스체크 통과 (${i}회차)"; exit 0
              fi
              sleep 5
            done
            echo "헬스체크 실패: /api/v1/health 가 60초 내 응답하지 않음"; exit 1

  # 알림) 결과 — 성공/실패 (배포 job 끝난 뒤 항상 실행)
  notify-done:
    needs: [changes, build-backend, build-frontend, deploy]
    if: always() && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Discord 결과 알림
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BE_BUILD: ${{ needs.build-backend.result }}
          FE_BUILD: ${{ needs.build-frontend.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          BE: ${{ needs.changes.outputs.backend }}
          FE: ${{ needs.changes.outputs.frontend }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$WEBHOOK" ] && { echo "DISCORD_WEBHOOK 미설정 — 스킵"; exit 0; }
          if [ "$BE_BUILD" = "failure" ] || [ "$FE_BUILD" = "failure" ]; then
            emoji="❌"; head="빌드 실패"
          elif [ "$DEPLOY_RESULT" = "success" ]; then
            emoji="✅"; head="배포 완료"
          elif [ "$DEPLOY_RESULT" = "failure" ]; then
            emoji="❌"; head="배포 실패"
          else
            emoji="⚠️"; head="배포 중단 ($DEPLOY_RESULT)"
          fi
          content=$(jq -n --arg emoji "$emoji" --arg head "$head" --arg be "$BE" --arg fe "$FE" --arg url "$RUN_URL" \
            '{content: ("\($emoji) **\($head)** · 백엔드: \($be) / 프론트: \($fe)\n앱: https://h14k011.p.ssafy.io\n[실행 로그](\($url))")}')
          curl -s -H "Content-Type: application/json" -d "$content" "$WEBHOOK" -o /dev/null -w "discord %{http_code}\n" || echo "알림 전송 실패(무시)"
