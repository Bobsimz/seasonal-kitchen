services:
  postgres:
    image: postgres:16
    container_name: seasonal-dining-postgres
    environment:
      POSTGRES_DB: seasonal_dining
      POSTGRES_USER: seasonal
      POSTGRES_PASSWORD: seasonal
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seasonal -d seasonal_dining"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: seasonal-dining-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
