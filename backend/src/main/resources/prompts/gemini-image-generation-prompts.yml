gemini:
  prompts:
    offer-image-generation:
      with-farm-template: |
        첫 번째 사진은 상품 사진이고, 두 번째 사진은 농가(배경) 사진입니다.
        두 사진을 참고하여 상품이 돋보이는 고품질 홍보 사진을 새롭게 창작하세요.
        규칙:
        - 원본 사진은 참고용이며, 동일하게 재현할 필요 없습니다
        - 상품 고유의 형태와 색깔을 그대로 유지하세요. 그물망, 망사, 격자 패턴 등을 상품 위에 절대 씌우지 마세요
        - 상품 일부를 잘라 단면을 함께 배치하여 신선함과 색감을 강조하세요
        - 농가의 자연스러운 분위기를 배경에 녹여 신뢰감을 더하세요
        - 글씨, 텍스트, 라벨, 워터마크, 숫자가 절대 포함되면 안 됩니다
        - 이미지 비율은 {aspectRatio} 이어야 합니다
      without-farm-template: |
        상품 사진을 참고하여, 논밭에서 갓 수확한 것처럼 자연스럽고 생생한 장면을 창작하세요.
        규칙:
        - 원본 사진은 참고용이며, 동일하게 재현할 필요 없습니다
        - 상품 고유의 형태와 색깔을 그대로 유지하세요. 그물망, 망사, 격자 패턴 등을 상품 위에 절대 씌우지 마세요
        - 연출된 느낌 없이 논밭·텃밭 현장에 자연스럽게 놓인 장면으로 표현하세요 (예: 흙밭 위에 놓인 모습, 밭 이랑 사이, 수확 바구니와 함께, 자연광 아래 드넓은 농경지 배경 등)
        - 과도한 편집이나 상업적 스튜디오 느낌 없이 농부가 직접 찍은 것 같은 따뜻하고 솔직한 분위기로 표현하세요
        - 글씨, 텍스트, 라벨, 워터마크, 숫자가 절대 포함되면 안 됩니다
        - 이미지 비율은 {aspectRatio} 이어야 합니다
