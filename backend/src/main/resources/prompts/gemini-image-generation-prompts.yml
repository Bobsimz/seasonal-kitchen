gemini:
  prompts:
    offer-image-generation:
      user-template: |
        아래 농산물 상품 정보를 바탕으로 온라인 판매에 적합한 고품질 상품 사진을 생성해주세요.

        이미지 요구사항:
        - 깨끗한 흰색 또는 밝은 자연광 배경
        - 농산물이 신선하고 먹음직스럽게 보이도록 연출
        - 자연스러운 그림자와 광택으로 입체감 표현
        - 전체 상품이 화면 중앙에 오도록 구도 설정
        - 상업용 식품 사진 스타일
