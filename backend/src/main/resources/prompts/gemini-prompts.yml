gemini:
  prompts:
    offer-photo-analysis:
      user-template: |
        농산물 사진을 분석하여 아래 JSON 형식으로만 응답하세요. 코드 블록 없이 순수 JSON만 반환하세요.

        {
          "ingredientName": "식재료명(한국어 표준명, 예: 무)",
          "productName": "품종·산지를 포함한 상품명(예: 해남 무, 제주 당근)",
          "category": "채소|과일|곡류|기타 중 정확히 하나",
          "storageMethod": "냉장 보관|냉동 보관|실온 보관|서늘한 그늘 중 정확히 하나",
          "storageTip": "보관 방법 관련 실용적인 문장 2개. 예: 신문지에 싸서 냉장 보관하면 2주까지 신선해요. 흙은 털지 말고 보관하세요.",
          "checkpoints": [
            { "keyword": "핵심 키워드 단어 1개", "sentence": "해당 키워드를 살린 소구 문장 1개" },
            { "keyword": "핵심 키워드 단어 1개", "sentence": "해당 키워드를 살린 소구 문장 1개" },
            { "keyword": "핵심 키워드 단어 1개", "sentence": "해당 키워드를 살린 소구 문장 1개" }
          ],
          "recipe": {
            "title": "이 식재료로 만드는 대표 요리 이름 1개",
            "steps": ["1단계 조리 설명", "2단계 조리 설명", "3단계 조리 설명"]
          }
        }

        판단 기준:
        - ingredientName: 사진에서 식별되는 농산물 이름(한국어 표준명)
        - productName: 알 수 있는 경우 산지·품종을 포함, 불명확하면 ingredientName과 동일하게 작성
        - category: 채소(배추·상추·시금치·깻잎·무·당근·감자·고구마·버섯 등 모든 채소류),
                    과일(사과·딸기·토마토·오이 등), 곡류(쌀·보리·콩 등), 기타
        - storageMethod: 해당 농산물에 가장 적합한 보관 방법 하나
        - storageTip: 구체적이고 실용적인 보관 팁 2문장(소비자가 바로 실천할 수 있는 내용)
        - checkpoints: 상품의 매력을 부각하는 소구포인트 정확히 3개.
                       keyword는 단어 1개(예: 아삭함, 당도, 신선도),
                       sentence는 해당 키워드를 살린 판매 문구 1문장
        - recipe: 해당 식재료를 활용한 대표 레시피 1개. steps는 3~4단계로 간결하게.

        농산물이 아니거나 식별 불가능한 경우:
        {
          "ingredientName": null,
          "productName": null,
          "category": null,
          "storageMethod": null,
          "storageTip": null,
          "checkpoints": null,
          "recipe": null
        }
    generate-description:
      user-template: |
        아래 농산물 정보를 바탕으로 상품 소개 문구를 작성하고, 반드시 다음 JSON 형식만 반환하세요.
        다른 필드명, 코드 블록, 추가 텍스트는 절대 사용하지 마세요.

        출력 형식(정확히 이 구조만 사용):
        {"description": "여기에 소개 문구 작성"}

        작성 기준:
        - 농가명을 첫 문장에 포함하여 신뢰감을 줄 것
        - 선택된 키워드를 자연스럽게 녹여 상품의 매력을 부각할 것
        - 소비자가 구매하고 싶어지는 따뜻하고 진솔한 문체
        - 전체 2~3문장, 150자 이내
        - 반드시 "description" 키 하나만 사용할 것
