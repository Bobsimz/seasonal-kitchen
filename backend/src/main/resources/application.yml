spring:
  profiles:
    default: local

  config:
    import:
      - optional:classpath:prompts/gemini-prompts.yml
      - optional:classpath:prompts/gemini-image-generation-prompts.yml

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:seasonal-dining-local-development-secret-key-change-me}
    access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
    image-model: ${GEMINI_IMAGE_MODEL:gemini-3.1-flash-image}
