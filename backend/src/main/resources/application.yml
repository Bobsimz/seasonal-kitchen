server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    default: local

  config:
    import:
      - optional:classpath:prompts/gemini-prompts.yml
      - optional:classpath:prompts/gemini-image-generation-prompts.yml

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:seasonal-dining-local-development-secret-key-change-me}
    access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
    refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}  # 14일
  uploads:
    storage: ${UPLOADS_STORAGE:local}
    dir: ${UPLOADS_DIR:uploads}
    public-base-url: ${UPLOADS_PUBLIC_BASE_URL:}
    max-bytes: ${UPLOADS_MAX_BYTES:5242880}
    s3:                                  # storage=s3 일 때만 사용 (LocalFileStorage 경로에선 무시됨)
      bucket: ${S3_BUCKET:}
      region: ${AWS_REGION:}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
    image-model: ${GEMINI_IMAGE_MODEL:gemini-3.1-flash-image}
