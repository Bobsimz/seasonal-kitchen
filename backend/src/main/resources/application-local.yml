spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:seasonal_dining}
    username: ${DB_USERNAME:seasonal}
    password: ${DB_PASSWORD:seasonal}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true

app:
  demo-seed:
    enabled: ${DEMO_SEED_ENABLED:true}
