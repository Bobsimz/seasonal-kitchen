spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:seasonal_dining}
    username: ${DB_USERNAME:seasonal}
    password: ${DB_PASSWORD:seasonal}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true

app:
  demo-seed:
    enabled: ${DEMO_SEED_ENABLED:true}
  # 로컬에서도 미디어(요리사진 dishes/*, 쇼츠 썸네일 thumbnails/* 등)를 운영 CDN에서 불러온다.
  # 비워두면 MediaUrlResolver가 루트 상대경로(/dishes/x.jpg)를 반환 → 프론트(localhost:3000)에 그 경로가 없어 404.
  uploads:
    public-base-url: ${UPLOADS_PUBLIC_BASE_URL:https://d1lcjrcsx3pn64.cloudfront.net}
