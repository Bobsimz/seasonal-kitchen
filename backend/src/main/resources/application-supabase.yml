spring:
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  flyway:
    enabled: true

app:
  demo-seed:
    enabled: ${DEMO_SEED_ENABLED:false}
  uploads:
    storage: s3
  # 운영 출처를 CORS 허용 목록에 포함한다. nginx same-origin이지만, 브라우저가 POST에
  # 붙이는 Origin 헤더를 Spring CORS 필터가 교차 출처로 판단해 403을 내는 것을 방지한다.
  # 기본값(localhost)만 있으면 POST 회원가입/로그인이 403으로 막힌다.
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://h14k011.p.ssafy.io,http://localhost:3000,http://127.0.0.1:3000}
