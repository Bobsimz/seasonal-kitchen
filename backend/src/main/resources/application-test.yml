spring:
  datasource:
    url: jdbc:h2:mem:seasonal_dining_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  flyway:
    enabled: true

app:
  uploads:
    dir: build/test-uploads   # 테스트 업로드 파일은 build 아래로 (repo 오염 방지)

