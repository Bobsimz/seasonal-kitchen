plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.seasonaldining'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
	implementation platform('software.amazon.awssdk:bom:2.44.11')
	implementation 'software.amazon.awssdk:s3'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// Testcontainers가 Docker 데몬을 찾게 한다. Colima(Docker Desktop 아님) 사용 시 DOCKER_HOST가
	// 비어 있으면 Flyway*IntegrationTest 9개가 "DockerClientProviderStrategy" 예외로 죽는다.
	// DOCKER_HOST 미설정 + 표준 Colima 소켓이 존재할 때만 주입하므로 CI/Docker Desktop에선 무영향.
	if (!System.getenv('DOCKER_HOST')) {
		def colimaSock = "${System.getProperty('user.home')}/.colima/default/docker.sock"
		if (file(colimaSock).exists()) {
			environment 'DOCKER_HOST', "unix://${colimaSock}"
			environment 'TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE', '/var/run/docker.sock'
		}
	}
}
